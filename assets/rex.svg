<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="Rex the T-rex">
  <title>Rex</title>
  <defs>
    <pattern id="spots" width="22" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#F2C94C"/>
      <circle cx="15" cy="9" r="1.6" fill="#F2C94C"/>
      <circle cx="8" cy="14" r="1.3" fill="#F2C94C"/>
      <circle cx="19" cy="16" r="1.1" fill="#F2C94C"/>
    </pattern>
  </defs>
  <!-- far legs (dark green) -->
  <g fill="#5E9A2A">
    <path d="M205 138c18-6 34 8 32 28-2 18-14 30-22 40l-6 12c10 0 22 2 26 8l-50 2c-6-4-4-10 2-14l10-14c4-10-4-20-8-30-6-14 2-28 16-32z"/>
    <path d="M150 156c-10 8-22 12-30 22-4 5-2 10 4 8l12-8c4 6 10 10 14 6l-2-12 14-10z"/>
  </g>
  <g fill="#B8BDB9">
    <path d="M189 230l-10 6 12-1z"/><path d="M200 231l-6 8 10-4z"/><path d="M122 186l-8 4 9 0z"/>
  </g>
  <!-- tail + body -->
  <path fill="#9DBA3E" d="M118 70c34-8 64 2 96 10 40 10 76 6 112-10 22-10 44-24 62-38-8 26-32 50-62 66-30 16-62 26-86 44-14 22-38 32-62 30-30-2-50-22-60-48-6-18-10-36 0-54z"/>
  <path fill="url(#spots)" opacity=".95" d="M150 74c30-2 56 8 84 12 36 5 70 2 104-12 16-7 30-16 40-24-10 20-30 36-56 48-30 14-60 24-84 42-12 16-32 22-50 20-22-4-36-20-44-40-4-12-4-30 6-46z"/>
