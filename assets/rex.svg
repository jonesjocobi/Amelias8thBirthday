  </g>
  <!-- near leg (lime) -->
  <path fill="#9DBA3E" d="M262 108c22-4 36 14 32 34-4 18-12 32-16 48-2 10-2 20 0 30 10 2 18 6 20 12h-54c-4-6 0-12 8-14l8-8c-4-18-8-34-12-50-6-24-2-48 14-52z"/>
  <path fill="url(#spots)" d="M266 116c16-2 24 10 22 24-2 14-8 26-12 38l-6-2c-4-14-6-28-8-42-2-10 0-16 4-18z"/>
  <path fill="none" stroke="#5E9A2A" stroke-width="3" stroke-linecap="round" d="M262 222c6-4 14-6 20-8"/>
  <g fill="#B8BDB9"><path d="M246 236l-10 4 12 1z"/><path d="M262 237l-6 7 10-3z"/><path d="M298 234l2 9 4-8z"/></g>
  <!-- near arm -->
  <path fill="#9DBA3E" d="M160 150c-6 10-16 18-26 22-6 3-6 10 0 10 6 0 10-4 14-8l2 12c4 2 8 0 8-4l2-14c6-4 10-10 12-16z"/>
  <g fill="#B8BDB9"><path d="M132 180l-8 2 8 3z"/><path d="M150 186l-2 8 6-6z"/></g>
