    <g class="rex-eye">
      <circle cx="104" cy="54" r="13" fill="#5E9A2A"/>
      <circle cx="104" cy="54" r="10" fill="#F6D34A"/>
      <circle cx="105" cy="54" r="5.5" fill="#1d1d1b"/>
      <circle cx="107" cy="51.5" r="2" fill="#fff"/>
    </g>
    <path fill="none" stroke="#5E9A2A" stroke-width="2.5" stroke-linecap="round" d="M90 42c8-6 22-6 30 2"/>
  </g>
