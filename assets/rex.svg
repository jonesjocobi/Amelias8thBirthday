<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-label="Rex the T-rex">
  <title>Rex</title>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB035"/>
      <stop offset=".45" stop-color="#A3C243"/>
      <stop offset="1" stop-color="#C6DA74"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F8A24"/>
      <stop offset="1" stop-color="#3D7019"/>
    </linearGradient>
    <linearGradient id="legNear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9C64A"/>
      <stop offset="1" stop-color="#7FA02C"/>
    </linearGradient>
    <radialGradient id="eye" cx=".4" cy=".4" r=".7">
      <stop offset="0" stop-color="#FFE77A"/>
      <stop offset="1" stop-color="#E0A21E"/>
    </radialGradient>
    <pattern id="spots" width="26" height="20" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="2.2" fill="#F2C94C"/>
      <circle cx="16" cy="9" r="1.7" fill="#F2C94C"/>
      <circle cx="9" cy="15" r="1.3" fill="#F2C94C"/>
      <circle cx="22" cy="17" r="1.1" fill="#F2C94C"/>
      <circle cx="23" cy="3" r="1" fill="#F2C94C"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".7"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="backMask" maskUnits="userSpaceOnUse" x="0" y="40" width="500" height="200">
      <rect x="0" y="40" width="500" height="200" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="290" cy="288" rx="150" ry="9" fill="#1E4614" opacity=".18"/>

  <g stroke="#2B5316" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- far leg (dark green, stepping back) -->
    <path fill="url(#skinDark)" d="M262 160C280 145 312 152 314 178C316 200 304 214 310 232C316 248 326 262 336 274L350 279C354 285 348 289 340 287L306 287C299 283 303 276 312 274C298 256 286 240 280 222C274 204 254 182 262 160Z"/>
    <!-- far arm -->
    <path fill="url(#skinDark)" d="M226 168C224 180 220 188 212 194C207 197 209 203 214 201L220 198C222 203 228 202 227 197L230 188C234 182 236 176 236 170Z"/>

    <!-- body, neck & tail -->
    <path fill="url(#skin)" d="M150 70C185 68 207 86 226 94C262 90 297 82 332 86C382 90 432 76 494 70C474 86 432 100 392 118C362 131 342 150 332 170C322 190 292 206 262 205C232 204 212 191 200 173C188 156 172 146 158 140Z"/>
    <path fill="url(#spots)" stroke="none" mask="url(#backMask)" d="M150 70C185 68 207 86 226 94C262 90 297 82 332 86C382 90 432 76 494 70C474 86 432 100 392 118C362 131 342 150 332 170C322 190 292 206 262 205C232 204 212 191 200 173C188 156 172 146 158 140Z"/>
  </g>

  <!-- body details: back ridge stripes, belly scutes, neck folds -->
  <g fill="none" stroke="#5E9A2A" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M236 98c4 10 4 20 0 30"/><path d="M262 94c5 12 5 24 1 36"/><path d="M290 90c5 12 4 24 0 34"/>
    <path d="M362 90c4 8 4 16 1 24"/><path d="M398 84c3 7 3 14 0 20"/><path d="M432 80c2 5 2 10 0 14"/>
  </g>
  <g fill="none" stroke="#8FAE3A" stroke-width="2" stroke-linecap="round">
    <path d="M206 176c18 6 40 10 62 8"/><path d="M216 188c16 6 32 8 50 7"/><path d="M182 150c-6 6-10 12-12 18"/><path d="M194 140c-5 4-8 9-10 14"/>
  </g>

  <g stroke="#2B5316" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- near leg (big muscular thigh) -->
    <path fill="url(#legNear)" d="M290 118C332 110 358 140 352 176C348 200 332 212 320 222C314 236 305 250 297 262L291 272C302 272 313 276 315 282L250 285C244 281 248 274 258 272L272 268C278 250 284 234 292 216C276 200 263 180 265 157C267 137 277 122 290 118Z"/>
    <path fill="url(#spots)" stroke="none" opacity=".9" d="M292 126C326 120 346 144 342 172C338 190 326 200 316 206C300 196 284 180 280 160C278 142 282 130 292 126Z"/>
    <!-- near arm -->
    <path fill="url(#skin)" d="M212 166C206 180 199 189 189 193C183 195 184 202 190 201L198 198C200 204 207 204 206 198L211 190C217 184 221 178 223 171Z"/>
  </g>
  <!-- thigh muscle + knee lines -->
  <g fill="none" stroke="#5E9A2A" stroke-width="3" stroke-linecap="round">
    <path d="M276 150c8 22 22 40 42 52"/><path d="M296 216c8 2 14 6 18 10"/><path d="M262 276c10-4 20-6 30-6"/>
  </g>
  <!-- claws -->
  <g fill="#E9ECE6" stroke="#6E7470" stroke-width="1.5" stroke-linejoin="round">
    <path d="M250 285l-12 1 9-6z"/><path d="M266 285l-10 5 4-7z"/><path d="M314 282l6 5-8-1z"/>
    <path d="M306 287l-11 1 8-6z"/><path d="M322 287l-9 5 3-7z"/>
    <path d="M190 201l-6 5 1-6z"/><path d="M206 198l-1 7-3-6z"/><path d="M214 201l-5 5 1-6z"/>
  </g>

  <!-- HEAD -->
  <g class="rex-head" stroke="#2B5316" stroke-width="2.5" stroke-linejoin="round">
    <!-- mouth inside -->
    <path fill="#6B1E2B" d="M34 104C70 110 120 118 168 116L166 136C126 146 84 154 52 150Z"/>
    <g transform="rotate(-13 166 128)">
    <!-- lower jaw -->
    <path fill="url(#skin)" d="M44 128C80 125 126 127 166 127C174 138 170 151 157 157C130 162 90 158 62 147C50 142 42 136 44 128Z"/>
    <path fill="none" stroke="#8FAE3A" stroke-width="1.8" d="M64 146c26 8 58 10 88 6"/>
    <!-- tongue -->
    <path fill="#E8689A" stroke="#B23C68" stroke-width="1.5" d="M52 126C82 116 122 118 152 124C146 133 94 136 58 133C52 132 49 128 52 126Z"/>
    <path fill="none" stroke="#C2416E" stroke-width="1.5" d="M70 126c22-3 46-3 70 0"/>
    <!-- lower teeth -->
    <path fill="#FFFDF5" stroke="#A9A99A" stroke-width="1" d="M56 128l4-8 4 8zM72 128l4-9 4 9zM88 128l4-8 4 8zM104 128l4-9 4 9zM120 128l4-8 4 8zM136 128l3-7 3 7z"/>
    </g>
    <!-- skull -->
    <path fill="url(#skin)" d="M26 94C24 82 34 75 52 71C80 65 100 57 122 56C142 55 160 61 172 74C181 85 181 104 172 118C150 121 120 116 90 112C70 110 46 108 32 106C28 104 26 99 26 94Z"/>
    <path fill="url(#spots)" stroke="none" d="M66 66C92 60 120 56 142 58C158 62 168 72 172 84L150 90C120 82 92 78 62 76Z"/>
    <!-- upper teeth -->
    <path fill="#FFFDF5" stroke="#A9A99A" stroke-width="1" d="M38 104l4 9 4-8zM52 106l4 10 4-9zM67 108l4 10 4-9zM82 110l4 10 4-9zM97 111l4 10 4-9zM112 113l4 9 4-8zM127 114l4 9 4-8zM142 116l3 7 3-7z"/>
  </g>
  <!-- face details -->
  <g fill="none" stroke="#5E9A2A" stroke-linecap="round">
    <path stroke-width="3" d="M146 92c10 6 18 16 20 26"/>
    <path stroke-width="2" d="M60 96c24 2 50 6 76 10"/>
    <path stroke-width="2" d="M150 136c6 4 10 10 10 16"/>
  </g>
  <ellipse cx="40" cy="83" rx="6.5" ry="3.5" fill="#5A2230" transform="rotate(-18 40 83)"/>
  <!-- brow ridge -->
  <path fill="#7FA02C" stroke="#2B5316" stroke-width="2.5" stroke-linejoin="round" d="M108 72C118 62 140 60 152 68C146 70 140 72 134 76C124 74 116 74 108 72Z"/>
  <!-- eye -->
  <g class="rex-eye">
    <ellipse cx="130" cy="82" rx="9.5" ry="8" fill="#3D7019"/>
    <circle cx="130" cy="82" r="6.5" fill="url(#eye)" stroke="#2B5316" stroke-width="1.5"/>
    <ellipse cx="130.5" cy="82" rx="1.8" ry="5.2" fill="#141410"/>
    <circle cx="132.5" cy="79.5" r="1.6" fill="#fff"/>
  </g>
</svg>
