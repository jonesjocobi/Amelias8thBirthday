    <path fill="url(#spots)" d="M70 40c30-2 56 6 70 22 6 10 6 22 2 30-20-6-40-10-60-12z"/>
    <path fill="#fff" d="M48 82l4 8 4-8zm14 0l4 8 4-8zm14 1l4 8 4-8zm14 1l4 8 4-8zm14 2l4 7 4-7zm14 2l4 7 4-7z"/>
