    <path fill="#8F2D3A" d="M54 80c30 0 62 6 92 14l-4 8c-30-6-62-8-92-4z"/>
    <path fill="#E8689A" d="M58 90c20-4 52-2 74 4 6 2 4 8-2 8-22-2-44-2-66 0-10 1-14-10-6-12z"/>
    <path fill="#C2416E" d="M70 94c18-1 38 0 54 3" stroke="#C2416E" stroke-width="2"/>
    <!-- lower jaw -->
    <path fill="#9DBA3E" d="M44 102c34-6 70-4 104 2 4 8 0 18-8 22-30 10-64 10-90 0-10-4-14-18-6-24z"/>
    <path fill="#fff" d="M60 103l4-7 4 7zm14-1l4-7 4 7zm14 0l4-7 4 7zm14 1l4-7 4 7zm14 1l4-6 4 6z"/>
